name: BBot Verify
run-name: bbot pr-${{ inputs.pr_number }} sha-${{ inputs.head_sha }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      head_sha:
        description: Exact pull request head commit
        required: true
        type: string
      app_path:
        description: Application directory below Apps
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bbot-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, linux, x64, bbot]
    timeout-minutes: 30
    env:
      BBOT_PR_NUMBER: ${{ inputs.pr_number }}
      BBOT_HEAD_SHA: ${{ inputs.head_sha }}
      BBOT_APP_PATH: ${{ inputs.app_path }}
    steps:
      - name: Check out immutable PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
          clean: true

      - name: Verify application installation
        run: |
          set -euo pipefail
          bbot verify \
            -pr "$BBOT_PR_NUMBER" \
            -sha "$BBOT_HEAD_SHA" \
            -app "$BBOT_APP_PATH"
