name: BBot Verify
run-name: bbot pr-${{ inputs.pr }} sha-${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      sha:
        description: Exact PR head SHA
        required: true
        type: string
      app:
        description: Application directory under Apps
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bbot-pr-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  verify:
    name: App Center E2E
    runs-on: [self-hosted, linux, x64, bbot-validation, zimaos-e2e]
    timeout-minutes: 90
    env:
      E2E_BBOT_PR: ${{ inputs.pr }}
      E2E_BBOT_SHA: ${{ inputs.sha }}
      E2E_BBOT_APP: ${{ inputs.app }}
      E2E_REPO: ${{ github.repository }}
      E2E_COMMIT: ${{ inputs.sha }}
      E2E_REF: refs/pull/${{ inputs.pr }}/head
      E2E_TRIGGER: bbot
      E2E_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      E2E_RUN_ID: bbot-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # The runner and plugin are trusted deployment artifacts.
      # Never execute PR scripts.
      - name: Verify application on a ZimaOS test VM
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/bbot-e2e-${{ github.run_id }}-${{ github.run_attempt }}/artifacts
          E2E_PLUGINS: ${{ runner.temp }}/bbot-e2e-${{ github.run_id }}-${{ github.run_attempt }}/plugins
        shell: bash
        run: |
          set -euo pipefail
          /home/ns2kracy/bbot-deploy/releases/pr-e2e-1793677419334/e2e plugin add /home/ns2kracy/bbot-deploy/releases/pr-e2e-1793677419334/bbot-appstore.wasm
          /home/ns2kracy/bbot-deploy/releases/pr-e2e-1793677419334/e2e run -suite bbot-appstore@2.3.0 \
            -id BBOT-01 -id BBOT-02 -gate -lanes 1 -os-version "" -env /home/ns2kracy/bbot-deploy/releases/pr-e2e-1793677419334/validation.env
          # Missing, skipped, failed or duplicate cases cannot pass.
          jq -se 'map(select(.type == "case_end" and (.case == "BBOT-01" or .case == "BBOT-02"))) | length == 2 and all(.verdict == "PASS") and (map(.case) | sort) == ["BBOT-01", "BBOT-02"]' \
            "$E2E_ARTIFACTS/$E2E_RUN_ID/events.jsonl"

      - name: Save ZimaOS verification logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bbot-zimaos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bbot-e2e-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/
          retention-days: 7
          if-no-files-found: warn
